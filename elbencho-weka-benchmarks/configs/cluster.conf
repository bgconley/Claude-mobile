#!/bin/bash
# Weka Cluster Configuration for elbencho Benchmarks
# Edit this file to match your cluster setup

# =============================================================================
# CLUSTER CONFIGURATION
# =============================================================================

# List of client hostnames/IPs (space-separated)
# These are the nodes that will participate in the benchmark
# Example: CLIENT_HOSTS="client1 client2 client3"
CLIENT_HOSTS="client1 client2 client3"

# The master node (one of the clients above) that will coordinate the test
MASTER_HOST="client1"

# Weka mount point (must be the same on all clients)
WEKA_MOUNT="/mnt/weka"

# Directory within Weka mount for benchmark files
# This will be created if it doesn't exist
BENCHMARK_DIR="${WEKA_MOUNT}/elbencho-test"

# =============================================================================
# BENCHMARK PARAMETERS
# =============================================================================

# File size for throughput tests (per thread)
THROUGHPUT_FILE_SIZE="10G"

# File size for latency tests (per thread)
LATENCY_FILE_SIZE="1G"

# Block size for throughput tests (larger = more throughput)
THROUGHPUT_BLOCK_SIZE="1M"

# Block size for latency tests (smaller = latency sensitive)
LATENCY_BLOCK_SIZE="4K"

# Number of threads per client for throughput tests
THROUGHPUT_THREADS=16

# Number of threads per client for latency tests
LATENCY_THREADS=8

# Number of files to create per thread
FILES_PER_THREAD=100

# =============================================================================
# ADVANCED SETTINGS
# =============================================================================

# Direct I/O (bypass page cache)
USE_DIRECT_IO=1

# Number of benchmark iterations
ITERATIONS=3

# Warmup iterations (results not counted)
WARMUP_ITERATIONS=1

# Time limit per phase (0 = no limit)
TIME_LIMIT_SECS=0

# Service port for elbencho (default: 8765)
SERVICE_PORT=8765

# Results directory
RESULTS_DIR="./results"

# Timestamp for this run
TIMESTAMP=$(date +%Y%m%d_%H%M%S)

# =============================================================================
# DERIVED SETTINGS (DO NOT EDIT)
# =============================================================================

# Convert client hosts to service list for elbencho
SERVICE_HOSTS=$(echo $CLIENT_HOSTS | tr ' ' ',')

# Number of clients
NUM_CLIENTS=$(echo $CLIENT_HOSTS | wc -w)
